<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0b10">
  <meta name="description" content="non.ac — Not ordinary. Not expected.">
  <title>non.ac</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090a0f;
      --ink: #f4f4ee;
      --muted: #9b9da8;
      --line: rgba(255,255,255,.13);
      --accent: #b7ff3c;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100svh;
      overflow: hidden;
      background:
        radial-gradient(circle at 82% 18%, rgba(183,255,60,.10), transparent 28rem),
        linear-gradient(135deg, #08090d, #101219 55%, #07080c);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .24;
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: linear-gradient(to bottom, black, transparent 82%);
    }
    main {
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: clamp(1.25rem, 4vw, 3.5rem);
    }
    header, footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      font-size: .72rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .mark { color: var(--ink); font-weight: 700; }
    .status { display: inline-flex; align-items: center; gap: .6rem; }
    .dot {
      width: .48rem; height: .48rem; border-radius: 50%; background: var(--accent);
      box-shadow: 0 0 1rem rgba(183,255,60,.75);
      animation: pulse 2.4s ease-in-out infinite;
    }
    .hero { align-self: center; max-width: 76rem; }
    .eyebrow {
      margin: 0 0 1.5rem;
      color: var(--accent);
      font: 600 .72rem/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .22em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(5rem, 17vw, 14rem);
      line-height: .76;
      letter-spacing: -.09em;
      font-weight: 800;
    }
    h1 span { color: var(--accent); }
    .lead {
      max-width: 36rem;
      margin: clamp(2rem, 5vw, 4rem) 0 0 clamp(.2rem, 10vw, 10rem);
      font-size: clamp(1.05rem, 2vw, 1.6rem);
      line-height: 1.55;
      color: #c9cad0;
    }
    .lead strong { color: var(--ink); font-weight: 600; }
    footer { border-top: 1px solid var(--line); padding-top: 1rem; }
    .coords { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    @keyframes pulse { 50% { opacity: .35; transform: scale(.72); } }
    @media (max-width: 560px) {
      header .edition, .coords { display: none; }
      h1 { font-size: clamp(5rem, 25vw, 8rem); }
      .lead { margin-left: 0; }
    }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="mark">non.ac</div>
      <div class="edition">Independent digital territory</div>
      <div class="status"><span class="dot"></span>online</div>
    </header>

    <section class="hero" aria-labelledby="title">
      <p class="eyebrow">Not ordinary / Not expected</p>
      <h1 id="title">non<span>.</span>ac</h1>
      <p class="lead"><strong>ここは、まだ何者でもない場所。</strong><br>Ideas, experiments, and everything that does not fit anywhere else.</p>
    </section>

    <footer>
      <span>© <span id="year"></span> non.ac</span>
      <span class="coords">7.9467° S · 14.3559° W</span>
      <span>Made on the open web</span>
    </footer>
  </main>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
