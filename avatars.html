<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0a0a0b">
  <meta name="description" content="non.ac — 所持アバター一覧と購入日。">
  <title>Avatars — non.ac</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="avatars.css?v=20260924-clean-labels">
  <link rel="stylesheet" href="site-additions.css?v=20260925-nav">
</head>
<body>
  <main class="avatar-main">
    <div class="back-row"><a class="back-to-about" href="index.html">← ABOUTに戻る</a></div>
    <section class="avatar-hero">
      <h1>Avatars<span>.</span></h1>
      <div class="avatar-intro"><p>所持アバター一覧を見る</p></div>
    </section>
    <section class="avatar-directory" aria-label="所持アバター一覧">
      <div class="avatar-controls">
        <label for="avatar-search">名前で探す<input id="avatar-search" type="search" placeholder="アバター名を入力" autocomplete="off"></label>
        <label for="avatar-year">購入年<select id="avatar-year"><option value="">すべての年</option></select></label>
        <span id="avatar-count" aria-live="polite">100 avatars</span>
      </div>
      <div id="avatar-list"><p class="avatar-loading">一覧を読み込み中…</p></div>
      <p class="avatar-note">「リンク未確認」は、販売ページの消失・非公開、または同名商品との判別ができなかったものです。リンク先の販売状況は変更される場合があります。</p>
    </section>
  </main>
  <footer class="site-footer"><p class="footer-mark">non.ac</p><div class="footer-note">Virtual photography<br>© <span data-year></span></div></footer>
  <script type="module" src="avatars.js?v=20260924-u"></script>
  <script src="app.js"></script>
</body>
</html>
